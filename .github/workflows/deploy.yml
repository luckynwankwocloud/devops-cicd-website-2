name: cicd website deployment
on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout website code
        uses: actions/checkout@v4

      - name: check website file exists
        run: test -f index.html

  display:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: checkout website code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2
        uses: appleboy/scp-action@master
        with:
          host: 54.85.68.206
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/var/www/html"
