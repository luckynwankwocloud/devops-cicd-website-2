name: cicd website deployment
on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: checkout website code
      uses: actions/checkout@v4

        - name: check website file exists
          run: test -f index,html

  display:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: checkout website code
        uses: actions/checkout@v4

          - name: display website content
            run:cat index.html                